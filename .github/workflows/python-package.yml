name: Python package

on:
  push:
    branches: [ "uncompiler" ]
  pull_request:
    branches: [ "uncompiler" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Añadí 3.12 que es la más reciente por si quieres estar al día
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5 # Actualizado a v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # Instalamos dependencias de tu proyecto si existen
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Detiene el proceso si hay errores de sintaxis
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Estos son solo avisos (warnings), no detienen el proceso
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        # Agregamos python -m para evitar problemas de rutas
        python -m pytest
