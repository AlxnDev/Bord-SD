name: Python package

on:
  push:
    branches: [ "uncompiler" ]
  pull_request:
    branches: [ "uncompiler" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Probamos en varias versiones de Python para asegurar compatibilidad
        python-version: ["3.10.5"]

    steps:
    - name: Checkout de mi repositorio
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar dependencias del sistema (Librerías GUI)
      # Esto instala los controladores de video y librerías que PyQt6 necesita en Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libegl1 \
          libgles2 \
          libxkbcommon-x11-0 \
          libdbus-1-3 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xinput0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libgl1-mesa-dev

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        # Instalamos las herramientas de test y tu librería principal
        pip install flake8 pytest PyQt6
        # Si tienes otros módulos en requirements.txt, se instalan aquí
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Revisión de sintaxis (Lint with flake8)
      run: |
        # Detiene el proceso si hay errores críticos (como los imports que faltaban)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Estos son solo avisos de estilo, no detienen el flujo
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Ejecutar tests con pytest
      run: |
        # MUY IMPORTANTE: "offscreen" permite que PyQt6 funcione sin monitor
        export QT_QPA_PLATFORM=offscreen
        python -m pytest
